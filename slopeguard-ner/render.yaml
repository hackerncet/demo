services:
  - type: web
    name: slopeguard-ner
    runtime: python
    region: oregon
    plan: free
    rootDir: slopeguard-ner
    buildCommand: pip install -r requirements.txt
    startCommand: python -m uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: SESSION_SECRET
        generateValue: true
      - key: DEMO_MODE
        value: "true"
      - key: ADMIN_PASSWORD
        sync: false
      - key: DATABASE_URL
        sync: false
